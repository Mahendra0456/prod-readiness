name: Production Readiness CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# GitHub OIDC permissions
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: prod-readiness
  DOCKER_IMAGE: prod-readiness


jobs:

  # ============================================================
  # 1. SECURITY CHECKS
  # ============================================================

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Gitleaks - Secret Detection
      # --------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Hadolint - Dockerfile Security/Lint
      # --------------------------------------------------------

      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # --------------------------------------------------------
      # Trivy Filesystem Scan
      # --------------------------------------------------------

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true


  # ============================================================
  # 2. BUILD + TRIVY IMAGE SCAN + DOCKERHUB PUSH
  # ============================================================

  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest
    needs: security-checks

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC Authentication
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977133951325:role/GitHubActionsProdReadiness
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS Identity
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Docker Build
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            .

      # --------------------------------------------------------
      # Trivy Docker Image Scan
      # --------------------------------------------------------

     - name: Trivy Docker Image Scan
       uses: aquasecurity/trivy-action@v0.36.0
       with:
         image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
         format: table
         severity: HIGH,CRITICAL
         exit-code: '1'
         ignore-unfixed: true

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Push Docker Image
      # --------------------------------------------------------

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"


  # ============================================================
  # 3. DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-scan-push

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977133951325:role/GitHubActionsProdReadiness
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Verify AWS OIDC
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Deploy through SSH
      # --------------------------------------------------------

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "===================================="
            echo "Starting deployment"
            echo "===================================="

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

            echo "Pulling image:"
            echo "$IMAGE"

            docker pull "$IMAGE"

            echo "Stopping old container..."

            docker stop prod-readiness 2>/dev/null || true
            docker rm prod-readiness 2>/dev/null || true

            echo "Starting new container..."

            docker run -d \
              --name prod-readiness \
              --restart unless-stopped \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --cpus="1" \
              --memory="512m" \
              -p 80:3000 \
              "$IMAGE"

            echo "Waiting for application..."

            sleep 10

            echo "Checking container..."

            docker ps --filter "name=prod-readiness"

            echo "Checking application health..."

            curl -f http://localhost/health

            echo "===================================="
            echo "Deployment successful"
            echo "===================================="


  # ============================================================
  # 4. FINAL HEALTH CHECK
  # ============================================================

  health-check:
    name: Final Deployment Check
    runs-on: ubuntu-latest
    needs: deploy

    steps:

      - name: Deployment completed
        run: |
          echo "===================================="
          echo "Production deployment completed"
          echo "===================================="

          echo "Application:"
          echo "prod-readiness"

          echo "Image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

          echo "AWS Region:"
          echo "${{ env.AWS_REGION }}"

          echo "Deployment status: SUCCESS"
