name: Production Readiness CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GITHUB TOKEN / OIDC PERMISSIONS
# ============================================================

permissions:
  contents: read
  id-token: write


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  AWS_REGION: ap-south-1
  DOCKER_IMAGE: prod-readiness


jobs:

  # ==========================================================
  # 1. SECURITY CHECKS
  # ==========================================================

  security-checks:
    name: Security Checks
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Gitleaks
      # ------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ------------------------------------------------------
      # Hadolint
      # ------------------------------------------------------

      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile


      # ------------------------------------------------------
      # Trivy Filesystem Scan
      # ------------------------------------------------------

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'


  # ==========================================================
  # 2. BUILD + TRIVY IMAGE SCAN + DOCKER HUB PUSH
  # ==========================================================

  build-scan-push:
    name: Build Scan and Push
    runs-on: ubuntu-24.04

    needs:
      - security-checks

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # AWS OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977133951325:role/GitHubActionsProdReadiness
          aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # Verify AWS OIDC
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ------------------------------------------------------
      # Docker Build
      # ------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            .


      # ------------------------------------------------------
      # Trivy Image Scan
      # ------------------------------------------------------

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'


      # ------------------------------------------------------
      # Docker Hub Login
      # ------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # Push Image
      # ------------------------------------------------------

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"


  # ==========================================================
  # 3. DEPLOY TO EC2
  # ==========================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04

    needs:
      - build-scan-push

    steps:

      # ------------------------------------------------------
      # AWS OIDC
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::977133951325:role/GitHubActionsProdReadiness         
         aws-region: ${{ env.AWS_REGION }}


      # ------------------------------------------------------
      # Verify AWS Identity
      # ------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ------------------------------------------------------
      # Deploy to EC2
      # ------------------------------------------------------

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "========================================"
            echo "Starting Production Deployment"
            echo "========================================"

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

            echo "Docker image:"
            echo "$IMAGE"

            echo "Pulling new image..."

            docker pull "$IMAGE"

            echo "Stopping old container..."

            docker stop prod-readiness 2>/dev/null || true

            echo "Removing old container..."

            docker rm prod-readiness 2>/dev/null || true

            echo "Starting new container..."

            docker run -d \
              --name prod-readiness \
              --restart unless-stopped \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --cpus="1" \
              --memory="512m" \
              -p 80:3000 \
              "$IMAGE"

            echo "Waiting for application..."

            sleep 10

            echo "Container status:"

            docker ps \
              --filter "name=prod-readiness"

            echo "Testing application health..."

            curl -f http://localhost/health

            echo "========================================"
            echo "Deployment Successful"
            echo "========================================"


  # ==========================================================
  # 4. FINAL HEALTH CHECK
  # ==========================================================

  health-check:
    name: Final Health Check
    runs-on: ubuntu-24.04

    needs:
      - deploy

    steps:

      - name: Deployment completed
        run: |
          echo "========================================"
          echo "Production Deployment Completed"
          echo "========================================"

          echo "Application:"
          echo "prod-readiness"

          echo "Image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

          echo "AWS Region:"
          echo "${{ env.AWS_REGION }}"

          echo "Status:"
          echo "SUCCESS"
