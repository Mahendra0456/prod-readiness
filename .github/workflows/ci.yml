name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:latest .

      - name: Login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:latest
