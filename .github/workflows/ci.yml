name: Production Readiness CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: prod-readiness

jobs:

  security-checks:
    name: Security Checks
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  build-scan-push:
    name: Build Scan and Push
    runs-on: ubuntu-24.04
    needs:
      - security-checks

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            .

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs:
      - build-scan-push

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "========================================"
            echo "Starting Production Deployment"
            echo "========================================"

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

            echo "Docker image:"
            echo "$IMAGE"

            echo "Pulling new image..."
            docker pull "$IMAGE"

            echo "Stopping old container..."
            docker stop prod-readiness 2>/dev/null || true

            echo "Removing old container..."
            docker rm prod-readiness 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name prod-readiness \
              --restart unless-stopped \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --cpus="1" \
              --memory="512m" \
              -p 80:3000 \
              "$IMAGE"

            echo "Waiting for application..."
            sleep 10

            echo "Container status:"
            docker ps --filter "name=prod-readiness"

            echo "Testing application health..."
            curl -f http://localhost/health

            echo "========================================"
            echo "Deployment Successful"
            echo "========================================"

  health-check:
    name: Final Health Check
    runs-on: ubuntu-24.04
    needs:
      - deploy

    steps:

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS "http://${{ secrets.EC2_HOST }}/health" && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          exit 1

      - name: Deployment completed
        run: |
          echo "========================================"
          echo "Production Deployment Completed"
          echo "========================================"
          echo "Application: prod-readiness"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"
          echo "Status: SUCCESS"
