name: Production Readiness CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness

jobs:

  # ==========================================
  # 1. SECURITY CHECKS
  # ==========================================
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------
      # Secret Scanning
      # ------------------------------
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------
      # Dockerfile Lint
      # ------------------------------
      - name: Hadolint Dockerfile scan
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # ------------------------------
      # Node.js Setup
      # ------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      # ------------------------------
      # Install Dependencies
      # ------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------
      # Dependency Security Scan
      # ------------------------------
      - name: Dependency audit
        run: npm audit --audit-level=high


  # ==========================================
  # 2. BUILD → TRIVY SCAN → DOCKER HUB
  # ==========================================
  build-scan-push:
    name: Build, Scan and Push
    needs: security-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      # ------------------------------
      # Docker Buildx
      # ------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ------------------------------
      # Build Image
      # ------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            .

      # ------------------------------
      # Trivy Image Scan
      # ------------------------------
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # ------------------------------
      # Docker Hub Login
      # ------------------------------
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------
      # Push SHA Image
      # ------------------------------
      - name: Push SHA image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${{ github.sha }}"

      # ------------------------------
      # Push Latest Image
      # ------------------------------
      - name: Push latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:latest"


  # ==========================================
  # 3. DEPLOY TO EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Starting production deployment"
            echo "========================================"

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "Pulling image..."
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

            echo "Stopping old container..."
            docker rm -f prod-readiness-app || true

            echo "Starting new container..."
            docker run -d \
              --name prod-readiness-app \
              --restart unless-stopped \
              -p 80:3000 \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --memory 256m \
              --cpus 0.5 \
              "${{ secrets.DOCKERHUB_USERNAME }}/prod-readiness:${{ github.sha }}"

            echo "Waiting for application..."
            sleep 10

            echo "Checking container..."
            docker ps --filter "name=prod-readiness-app"

            echo "Checking application health..."
            curl --fail --max-time 10 http://localhost/health

            echo "Checking container user..."
            docker exec prod-readiness-app id

            echo "========================================"
            echo "Deployment successful"
            echo "========================================"
